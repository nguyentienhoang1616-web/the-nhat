<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thẻ từ vựng nhà thuê</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2c6e49">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Thẻ Nhật">
<style>.wrap{padding-top:calc(14px + env(safe-area-inset-top));padding-bottom:calc(28px + env(safe-area-inset-bottom))}</style>
<style>
:root{
  --bg:#f4f1ea; --ink:#1f2a24; --muted:#6a746e; --card:#ffffff; --card2:#e8f3ea; --line:#d8d2c4;
  --ok:#1f8a4c; --no:#c0392b; --accent:#2c6e49; --chip:#ebe6d8; --chipOn:#2c6e49; --chipOnInk:#fff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#15191a; --ink:#ecefe9; --muted:#9aa59d; --card:#222a27; --card2:#1d3a2b; --line:#34403a;
    --ok:#4cc27d; --no:#ef6b5b; --accent:#6fcf97; --chip:#262f2b; --chipOn:#6fcf97; --chipOnInk:#0d1a12;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,"Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",sans-serif}
.term,.read{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:14px 16px 28px}
h1{font-size:18px;margin:4px 0 10px;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--chip);color:var(--ink);
  padding:7px 11px;border-radius:999px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--chipOn);color:var(--chipOnInk);border-color:var(--chipOn);font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:2px 0 10px;align-items:center}
.opts label{display:flex;align-items:center;gap:5px;cursor:pointer}
.opts button{margin-left:auto;background:none;border:none;color:var(--muted);text-decoration:underline;font-size:12px;cursor:pointer}
.prog{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:6px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.stage{touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab;position:relative}
.stage.drag{transition:none}
.stage.snap{transition:transform .25s ease,opacity .25s ease}
.card{perspective:1200px;height:min(58vh,400px);min-height:300px}
.inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:18px;border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:22px 18px;box-shadow:0 6px 22px rgba(0,0,0,.08)}
.front{background:var(--card)}
.back{background:var(--card2);transform:rotateY(180deg)}
.tag{position:absolute;top:12px;left:14px;font-size:12px;color:var(--muted)}
.hint{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
.term{font-weight:700;line-height:1.25;word-break:break-all}
.t1{font-size:76px}.t2{font-size:54px}.t3{font-size:38px}.t4{font-size:26px}
.read{margin-top:14px;font-size:24px;color:var(--accent);font-weight:600;word-break:break-all}
.mean{font-size:30px;font-weight:700;line-height:1.3}
.note{margin-top:14px;font-size:17px;color:var(--ink);background:rgba(0,0,0,.05);padding:8px 12px;border-radius:10px}
.small{margin-top:12px;font-size:13px;color:var(--muted)}
.small b{color:var(--ink);font-size:16px}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:14px}
.btns button{padding:14px 6px;font-size:15px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);cursor:pointer;font-weight:600}
.btns .no{color:var(--no);border-color:var(--no)}
.btns .ok{color:var(--ok);border-color:var(--ok)}
.help{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6;text-align:center}
.done{text-align:center;padding:40px 10px}
.done h2{margin:0 0 8px}
.done button{margin-top:14px;padding:12px 18px;border-radius:12px;border:none;background:var(--chipOn);color:var(--chipOnInk);font-size:15px;font-weight:700;cursor:pointer}
.stamp{position:absolute;top:18px;padding:4px 12px;border:3px solid;border-radius:8px;font-weight:800;font-size:20px;opacity:0;pointer-events:none;z-index:2}
.stamp.ok{right:16px;color:var(--ok);transform:rotate(12deg)}
.stamp.no{left:16px;color:var(--no);transform:rotate(-12deg)}
</style>
</head>
<body>
<div class="wrap">
  <h1>📇 Thẻ từ vựng nhà thuê</h1>
  <div class="chips" id="chips"></div>
  <div class="opts">
    <label><input type="checkbox" id="oShuffle" checked> Trộn</label>
    <label><input type="checkbox" id="oUnknown" checked> Chỉ thẻ chưa thuộc</label>
    <label><input type="checkbox" id="oRead" checked> Hiện cách đọc mặt trước</label>
    <button id="reset">Xoá tiến độ</button>
  </div>
  <div class="prog"><span id="pLeft"></span><span id="pKnown"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div id="area"></div>
  <div class="btns" id="btns">
    <button class="no" id="bNo">✗ Chưa thuộc</button>
    <button id="bFlip">↺ Lật thẻ</button>
    <button class="ok" id="bOk">✓ Thuộc rồi</button>
  </div>
  <div class="help">Bấm vào thẻ để lật. Vuốt sang phải = thuộc rồi, vuốt sang trái = chưa thuộc.<br>Bàn phím: Space lật · ← chưa thuộc · → thuộc rồi.</div>
</div>

const GROUPS = [...new Set(DATA.map(d => d[0]))];
const KEY = 'tv-known-v1';
let known = new Set();
try { known = new Set(JSON.parse(localStorage.getItem(KEY) || '[]')); } catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...known])); } catch (e) {} }

let deck = 'all', queue = [], flipped = false;
const $ = id => document.getElementById(id);

function shuffle(a){ for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function pool(){ return DATA.filter(d => deck === 'all' || d[0] === deck); }

function buildChips(){
  const box = $('chips'); box.innerHTML = '';
  const mk = (val, label) => {
    const b = document.createElement('button');
    b.className = 'chip' + (deck === val ? ' on' : '');
    b.textContent = label;
    b.onclick = () => { deck = val; buildChips(); rebuild(); };
    box.appendChild(b);
  };
  mk('all', 'Tất cả (' + DATA.length + ')');
  GROUPS.forEach(g => mk(g, g.replace(/\s*\(.*\)\s*$/, '') + ' (' + DATA.filter(d => d[0] === g).length + ')'));
}

function rebuild(){
  let list = pool();
  if ($('oUnknown').checked) list = list.filter(d => !known.has(d[1]));
  queue = list.slice();
  if ($('oShuffle').checked) shuffle(queue);
  flipped = false;
  render();
}

function sizeClass(t){ const n = [...t].length; return n <= 3 ? 't1' : n <= 6 ? 't2' : n <= 10 ? 't3' : 't4'; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function updateProg(){
  const p = pool(), k = p.filter(d => known.has(d[1])).length;
  $('pLeft').textContent = queue.length ? 'Còn ' + queue.length + ' thẻ trong vòng này' : 'Hết vòng';
  $('pKnown').textContent = 'Đã thuộc ' + k + ' / ' + p.length;
  $('bar').style.width = (p.length ? k / p.length * 100 : 0) + '%';
}

function render(){
  updateProg();
  const area = $('area');
  if (!queue.length) {
    $('btns').style.display = 'none';
    area.innerHTML = '<div class="done"><h2>🎉 Xong bộ này</h2><div>Bạn đã đi hết các thẻ trong vòng này.</div>' +
      '<button id="again">Học lại cả bộ</button></div>';
    $('again').onclick = () => { $('oUnknown').checked = false; rebuild(); };
    return;
  }
  $('btns').style.display = 'grid';
  const d = queue[0];
  const showRead = $('oRead').checked && d[2] && d[2] !== d[1];
  area.innerHTML =
    '<div class="stage" id="stage">' +
      '<div class="stamp ok" id="sOk">THUỘC</div><div class="stamp no" id="sNo">CHƯA</div>' +
      '<div class="card' + (flipped ? ' flipped' : '') + '" id="card"><div class="inner">' +
        '<div class="face front"><div class="tag">' + esc(d[0].replace(/\s*\(.*\)\s*$/, '')) + '</div>' +
          '<div class="term ' + sizeClass(d[1]) + '">' + esc(d[1]) + '</div>' +
          (showRead ? '<div class="read">' + esc(d[2]) + '</div>' : '') +
          '<div class="hint">bấm để lật</div></div>' +
        '<div class="face back"><div class="tag">' + esc(d[1]) + (d[2] && d[2] !== d[1] ? ' · ' + esc(d[2]) : '') + '</div>' +
          '<div class="mean">' + esc(d[3]) + '</div>' +
          (d[4] ? '<div class="note">' + esc(d[4]) + '</div>' : '') +
          (d[5] ? '<div class="small">Gặp ở: <b>' + esc(d[5]) + '</b></div>' : '') + '</div>' +
      '</div></div></div>';
  attachDrag();
}

function flip(){ if (!queue.length) return; flipped = !flipped; const c = $('card'); if (c) c.classList.toggle('flipped', flipped); }

function answer(ok){
  if (!queue.length) return;
  const d = queue.shift();
  if (ok) { known.add(d[1]); save(); }
  else { queue.push(d); }
  if (ok && $('oUnknown').checked === false) { /* giữ trong vòng nhưng đã đánh dấu */ }
  flipped = false;
  render();
}

function fly(dir){
  const s = $('stage'); if (!s) return answer(dir > 0);
  s.classList.remove('drag'); s.classList.add('snap');
  s.style.transform = 'translateX(' + (dir * 480) + 'px) rotate(' + (dir * 16) + 'deg)';
  s.style.opacity = '0';
  setTimeout(() => answer(dir > 0), 230);
}

function attachDrag(){
  const s = $('stage'); if (!s) return;
  let sx = 0, sy = 0, dx = 0, down = false, moved = false;
  const sOk = $('sOk'), sNo = $('sNo');
  s.addEventListener('pointerdown', e => { down = true; moved = false; sx = e.clientX; sy = e.clientY; dx = 0; s.classList.add('drag'); try { s.setPointerCapture(e.pointerId); } catch (x) {} });
  s.addEventListener('pointermove', e => {
    if (!down) return;
    dx = e.clientX - sx;
    if (Math.abs(dx) > 8) moved = true;
    if (moved) {
      s.style.transform = 'translateX(' + dx + 'px) rotate(' + (dx / 22) + 'deg)';
      sOk.style.opacity = dx > 0 ? Math.min(1, dx / 90) : 0;
      sNo.style.opacity = dx < 0 ? Math.min(1, -dx / 90) : 0;
    }
  });
  const end = () => {
    if (!down) return; down = false;
    if (!moved) { s.classList.remove('drag'); flip(); return; }
    if (dx > 90) return fly(1);
    if (dx < -90) return fly(-1);
    s.classList.remove('drag'); s.classList.add('snap');
    s.style.transform = ''; sOk.style.opacity = 0; sNo.style.opacity = 0;
  };
  s.addEventListener('pointerup', end);
  s.addEventListener('pointercancel', end);
}

$('bFlip').onclick = flip;
$('bOk').onclick = () => fly(1);
$('bNo').onclick = () => fly(-1);
['oShuffle','oUnknown'].forEach(id => $(id).onchange = rebuild);
$('oRead').onchange = render;
$('reset').onclick = () => { if (confirm('Xoá hết tiến độ "đã thuộc"?')) { known = new Set(); save(); rebuild(); } };
document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); flip(); }
  else if (e.code === 'ArrowRight') fly(1);
  else if (e.code === 'ArrowLeft') fly(-1);
});

buildChips();
